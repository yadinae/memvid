name: Build memvid-sdk wheel for manylinux2_28 (glibc 2.17+, incl. glibc 2.32 alinux8)

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'memvid-sdk version to build'
        required: true
        default: '2.0.160'

jobs:
  build:
    runs-on: ubuntu-24.04   # glibc 2.39 on runner host, but maturin --target-dir builds against its own glibc; see strategy below
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y python3 python3-pip

      - name: Download sdist from PyPI
        run: |
          VERSION="${{ github.event.inputs.sdk_version || '2.0.160' }}"
          pip download "memvid-sdk==${VERSION}" --no-binary :all: --no-deps -d /tmp/sdist
          tar xzf /tmp/sdist/memvid_sdk-${VERSION}.tar.gz -C /tmp/
          ls /tmp/memvid_sdk-${VERSION}/

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel (abi3, py3.8+)
        working-directory: /tmp/memvid_sdk-${{ github.event.inputs.sdk_version || '2.0.160' }}
        run: |
          maturin build --release --features lex,vec,temporal_track --out /tmp/wheels
          ls -la /tmp/wheels/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: memvid-sdk-wheel
          path: /tmp/wheels/*.whl
