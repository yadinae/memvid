name: Build memvid-sdk wheel (manylinux_2_28, glibc>=2.28 -> works on alinux8 glibc2.32)

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'memvid-sdk version to build'
        required: true
        default: '2.0.160'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Install Rust inside manylinux container
        run: |
          yum install -y openssl-devel curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.85
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Setup Python
        run: |
          ls /opt/python/
          PYBIN=$(ls -d /opt/python/cp311*/bin | head -1)
          echo "PYBIN=$PYBIN" >> "$GITHUB_ENV"
          "$PYBIN/pip" install --upgrade pip maturin

      - name: Download sdist from PyPI
        run: |
          VERSION="${{ github.event.inputs.sdk_version || '2.0.160' }}"
          "$PYBIN/pip" download "memvid-sdk==${VERSION}" --no-binary :all: --no-deps -d /tmp/sdist
          tar xzf "/tmp/sdist/memvid_sdk-${VERSION}.tar.gz" -C /tmp/
          echo "SRC=/tmp/memvid_sdk-${VERSION}" >> "$GITHUB_ENV"

      - name: Build wheel (abi3 py3.8+, lex+vec+temporal_track)
        run: |
          cd "$SRC"
          "$PYBIN/maturin" build --release --features lex,vec,temporal_track --out /tmp/wheels
          ls -la /tmp/wheels/
          mkdir -p /tmp/wheels_repaired
          auditwheel repair /tmp/wheels/*.whl -w /tmp/wheels_repaired 2>&1 || cp /tmp/wheels/*.whl /tmp/wheels_repaired/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: memvid-sdk-manylinux2_28-wheel
          path: /tmp/wheels_repaired/*.whl
